<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="assets/images/favicon.png">
    <link rel="stylesheet" href="assets/css/styles.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found — HomeInventory-HQ</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root{
            --navy:#0C2340;--blue:#1B5FA8;--sky:#E8F2FF;
            --text:#1A1A2E;--muted:#6B7280;--border:#E5EAF0;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'DM Sans',sans-serif;background:#F8FAFD;color:var(--text);
            line-height:1.7;display:flex;flex-direction:column;min-height:100vh}

        header{
            background:var(--navy);padding:20px 0;
            display:flex;align-items:center;gap:12px;
            padding-left:24px;padding-right:24px;
            box-shadow:0 2px 20px rgba(12,35,64,.3);
        }
        .logo-mark{
            width:36px;height:36px;border-radius:10px;
            background:linear-gradient(135deg,var(--blue),#4AABFF);
            display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;
        }
        .logo-text{font-family:'DM Serif Display',serif;font-size:20px;color:#fff}
        .logo-text span{color:#4AABFF}

        main{flex:1;display:flex;align-items:center;justify-content:center;padding:60px 24px}
        .content{text-align:center;max-width:480px}
        .error-num{
            font-family:'DM Serif Display',serif;font-size:clamp(96px,20vw,160px);
            line-height:1;color:var(--blue);opacity:.18;margin-bottom:-10px;
        }
        .content h1{font-family:'DM Serif Display',serif;font-size:clamp(28px,5vw,40px);color:var(--navy);margin-bottom:14px}
        .content p{color:var(--muted);font-size:16px;margin-bottom:30px}

        .btn-group{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
        .btn{
            display:inline-block;text-decoration:none;font-weight:600;font-size:15px;
            padding:13px 26px;border-radius:999px;transition:background .2s,opacity .2s;
        }
        .btn-primary{background:#4AABFF;color:#fff}
        .btn-primary:hover{background:#69BAFF}
        .btn-secondary{background:var(--sky);color:var(--blue);border:1px solid #D8E7FB}
        .btn-secondary:hover{background:#DCEBFB}

        footer{
            background:var(--navy);padding:26px;text-align:center;color:rgba(255,255,255,.45);
        }
        footer a{color:rgba(255,255,255,.6)}
    </style>
</head>
<body>
<header>
    <div class="logo-mark">🏠</div>
    <div class="logo-text">Home<span>Inventory-HQ</span></div>
</header>

<main>
    <div class="content">
        <div class="error-num">404</div>
        <h1>Page not found</h1>
        <p>The page you requested could not be found. Try returning home.</p>
        <div class="btn-group">
            <a href="index.html" class="btn btn-primary">Go Home</a>
            <a href="support.html" class="btn btn-secondary">Get Support</a>
        </div>
    </div>
</main>

<footer>
    <p>© 2026 HomeInventory-HQ · <a href="privacy-policy.html">Privacy</a> · <a href="assets/terms.html">Terms</a> · <a href="support.html">Support</a></p>
</footer>
</body>
</html>
